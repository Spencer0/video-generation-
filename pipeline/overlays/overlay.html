<!doctype html>
<html><head><meta charset="utf-8"><title>overlay</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="helpers.js"></script>
<script>
// Overlay engine for videos/001-water-bag. Everything is a pure function of
// (timeline, frame) so Playwright can screenshot any frame independently.
const W = 1080, H = 1920;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let TL = null, WORDS = [], CHUNKS = [], BEATS = {};

// ---------------------------------------------------------------- overlay-only helpers (generic ones live in helpers.js)
function flash(t,at,{dur=0.22,peak=0.55,color='255,255,255'}={}){
  const k=(t-at)/dur; if(k<0||k>1)return; ctx.save(); ctx.fillStyle=`rgba(${color},${peak*(1-easeOutCubic(k))})`; ctx.fillRect(0,0,W,H); ctx.restore();
}
function vignette(){
  const k=(window.BEATS&&window.BEATS.vignette!==undefined)?window.BEATS.vignette:0.5; if(k<=0)return;   // per-video strength (bright sets want ~0.15)
  const g=ctx.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.72); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${k})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function panel(x,y,w,h,alpha=1){ctx.save();ctx.globalAlpha=ctx.globalAlpha*alpha;rr(x,y,w,h,36);ctx.fillStyle='rgba(8,10,16,0.72)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.stroke();ctx.restore()}
function stopwatch(sec,x,y,{color=C.white,size=74,label=null,alpha=1}={}){
  const s=Math.max(0,sec); const str=s.toFixed(2)+'s';
  ctx.save(); ctx.globalAlpha=ctx.globalAlpha*alpha; const w=380,h=118; rr(x-w,y-h/2,w,h,28); ctx.fillStyle='rgba(8,10,16,0.78)'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.stroke();
  // tiny clock icon
  ctx.beginPath(); ctx.arc(x-w+54,y,22,0,Math.PI*2); ctx.lineWidth=5; ctx.strokeStyle=color; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-w+54,y); ctx.lineTo(x-w+54,y-14); ctx.lineTo(x-w+64,y-4); ctx.stroke();
  font(800,size); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle=color; ctx.fontVariantNumeric='tabular-nums';
  ctx.fillText(str,x-30,y+3);
  if(label) text(label,x-w/2,y+h/2+34,{size:30,weight:700,color:'rgba(255,255,255,0.8)',stroke:false,shadow:true});
  ctx.restore();
}
function stamp(label,x,y,t0,t,{color=C.red,size=120,rot=-0.14}={}){
  const k=t-t0; if(k<0)return; const s=lerp(1.6,1,easeOutBack(k/0.28)); const a=smooth(0,0.08,k);
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s); ctx.globalAlpha=a;
  font(900,size); const w=ctx.measureText(label).width+70, h=size*1.35;
  rr(-w/2,-h/2,w,h,22); ctx.lineWidth=12; ctx.strokeStyle=color; ctx.stroke(); ctx.fillStyle='rgba(8,10,16,0.55)'; ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=color; ctx.fillText(label,0,size*0.06); ctx.restore();
  if(k<0.35) flash(t,t0,{dur:0.18,peak:0.22});
}
function wordTime(beatId,word,nth=0){ // start time of the nth occurrence of a word in a beat
  const b=BEATS[beatId]; let n=0; for(const l of b.lines) for(const w of l.words){ if(w.word.toLowerCase().replace(/[^a-z0-9']/g,'')===word.toLowerCase()){ if(n===nth) return w.start; n++; } } return b.start;
}

// ---------------------------------------------------------------- captions (TikTok style, word-synced)
const CAPTION_Y = 1460;
let KEYWORDS = new Set();  // per-video, from window.BEATS.keywords
function buildChunks(){
  WORDS=[]; TL.beats.forEach(b=>b.lines.forEach(l=>l.words.forEach(w=>WORDS.push({...w,beat:b.id}))));
  CHUNKS=[]; let cur=[];
  const flush=()=>{if(cur.length){CHUNKS.push({words:cur,start:cur[0].start,end:cur[cur.length-1].end});cur=[]}};
  WORDS.forEach((w,i)=>{ cur.push(w); const punct=/[.!?,;:]$|\.\.\.$/.test(w.word); const next=WORDS[i+1];
    if(punct||cur.length>=3||!next||next.beat!==w.beat) flush(); });
  CHUNKS.forEach((c,i)=>{const nx=CHUNKS[i+1]; c.hide = nx ? Math.min(c.end+0.6, nx.start) : c.end+0.9;});
}
function drawCaptions(t){
  if(window.NO_CAPTIONS) return;
  const CS=(window.BEATS&&window.BEATS.caption)||{}; const POP=CS.pop||1.12, KEYCOL=CS.keywordColor||C.orange;
  const c=CHUNKS.find(c=>t>=c.start-0.04 && t<c.hide); if(!c)return;
  const size=CS.size||78, gap=22; font(900,size);
  const info=c.words.map(w=>{ const active = t>=w.start-0.02 && t<w.end+0.02; const spoken = t>=w.start-0.02;
    const key = KEYWORDS.has(w.word.toLowerCase().replace(/[^a-z']/g,'')) || /\d/.test(w.word);
    const ws = active ? lerp(1.0,POP,easeOutBack((t-w.start)/0.12)) : 1;
    return {w, ws, width:ctx.measureText(w.word.toUpperCase()).width*ws, col: active ? C.yellow : (spoken && key ? KEYCOL : C.white)}; });
  const total=info.reduce((a,b)=>a+b.width,0)+gap*(info.length-1);
  const scaleAll = total>960 ? 960/total : 1;
  const y=CS.y||CAPTION_Y; let x=W/2-total*scaleAll/2;
  const pop = CS.pop ? 1 : lerp(0.85,1,easeOutBack((t-c.start)/0.16));
  info.forEach((it,i)=>{
    const s = it.ws*pop*scaleAll; const cx = x+it.width*scaleAll/2;
    ctx.save(); ctx.translate(cx,y); ctx.scale(s,s);
    text(it.w.word.toUpperCase(),0,0,{size,weight:900,color:it.col,strokeW:14});
    ctx.restore(); x+=it.width*scaleAll+gap*scaleAll;
  });
}

window.setTimeline=function(tl){TL=tl; BEATS={}; TL.beats.forEach(b=>BEATS[b.id]=b); KEYWORDS=new Set((window.BEATS&&window.BEATS.keywords)||[]); buildChunks();};
window.renderFrame=function(f){
  const t=f/TL.fps; ctx.clearRect(0,0,W,H); vignette();
  const V=window.BEATS||{draw:{},cutFlash:[]};
  for(const b of TL.beats){ if(t>=b.start && t<b.end){ const fn=V.draw[b.id]; if(fn) fn(t-b.start,t,b); } }
  drawCaptions(t);
  for(const id of V.cutFlash){ if(BEATS[id]) flash(t,BEATS[id].start,{dur:0.2,peak:0.45}); }
  return true;
};
</script></body></html>
