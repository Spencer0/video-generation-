<!doctype html>
<html><head><meta charset="utf-8"><title>carousel panels</title>
<style>
  @font-face{font-family:"Permanent Marker";src:url("fonts/PermanentMarker-Regular.ttf") format("truetype")}
  html,body{margin:0;padding:0;background:#F4F0E6}
  canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../overlays/helpers.js"></script>
<script>
// Carousel engine: one opaque 1080x1920 panel per call. A post is one
// carousels/<id>/panels.js that sets window.PANELS = {draw:[fn,...], meta:{...}};
// each fn(p) draws onto the paper with the shared helpers, p = {i, n, sim}.
// Everything is deterministic: paper and marker wobble are seeded from i.
const W = 1080, H = 1920;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
// Readable area + UI zones from pipeline/safe_area.json (render_panels.py injects window.SAFE_ZONES; this is the fallback copy).
const SAFE_DEFAULT = {"readable": {"x0": 110, "y0": 250, "x1": 970, "y1": 1560, "x1_below_1040": 860, "_comment": "Anything that must be read goes here. Below y=1040 the right edge is 860, not 970. Centred lines: width <= 860 above y=1040, <= 750 below it."}, "zones": [{"id": "side_crop_left", "x0": 0, "y0": 0, "x1": 110, "y1": 1920, "why": "cropped off on phones taller than 9:16"}, {"id": "side_crop_right", "x0": 970, "y0": 0, "x1": 1080, "y1": 1920, "why": "cropped off on phones taller than 9:16"}, {"id": "top_bar", "x0": 0, "y0": 0, "x1": 1080, "y1": 250, "why": "status bar, Following / For You / Friends tabs, search"}, {"id": "right_column", "x0": 860, "y0": 1040, "x1": 1080, "y1": 1920, "why": "avatar, like, comment, save, share, sound disc"}, {"id": "bottom_caption", "x0": 0, "y0": 1560, "x1": 900, "y1": 1920, "why": "username, caption (2 lines + more), sound marquee"}]};
const SAFE_AREA = () => (window.SAFE_ZONES || SAFE_DEFAULT);
const SAFE = {x0:110, x1:970, y0:250, y1:1560, x1Low:860};   // readable rectangle; right edge is x1Low below y=1040

// Every glyph run that reaches a canvas is logged with its device-space bounds
// and a kind ('body' by default, 'problem' inside problem(), 'glyph' for coin
// letters, 'chrome' for the corner tags) so render_panels.py can assert the
// safe area and count words without trusting the eye.
let TEXT_LOG = [];
window.TEXT_KIND = 'body';
window.TEXT_HOOK = function(c, str, x, y, mode){
  const m = c.measureText(str), T = c.getTransform(), pad = mode==='stroke' ? c.lineWidth/2 : 0;
  const xs = [x-m.actualBoundingBoxLeft-pad, x+m.actualBoundingBoxRight+pad], ys = [y-m.actualBoundingBoxAscent-pad, y+m.actualBoundingBoxDescent+pad];
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for(const px of xs) for(const py of ys){ const X=T.a*px+T.c*py+T.e, Y=T.b*px+T.d*py+T.f; x0=Math.min(x0,X); x1=Math.max(x1,X); y0=Math.min(y0,Y); y1=Math.max(y1,Y); }
  TEXT_LOG.push({str:String(str), mode, kind:window.TEXT_KIND, font:c.font, color:String(c.fillStyle), bounds:[x0,y0,x1,y1].map(v=>Math.round(v*10)/10)});
};
const _fill = ctx.fillText.bind(ctx), _stroke = ctx.strokeText.bind(ctx);
ctx.fillText = (s,x,y,mw)=>{ window.TEXT_HOOK(ctx,s,x,y,'fill'); return mw===undefined?_fill(s,x,y):_fill(s,x,y,mw); };
ctx.strokeText = (s,x,y,mw)=>{ window.TEXT_HOOK(ctx,s,x,y,'stroke'); return mw===undefined?_stroke(s,x,y):_stroke(s,x,y,mw); };
function withKind(kind, fn){ const k=window.TEXT_KIND; window.TEXT_KIND=kind; try{ return fn(); } finally { window.TEXT_KIND=k; } }
function problem(fn){ return withKind('problem', fn); }   // problem-statement text is exempt from the word cap

// Corner tags: handle bottom-left, counter + swipe arrow (none on the last panel) right-aligned
// to the LOWER readable edge (x1Low), i.e. left of TikTok's like/comment/save column.
function cornerTags(i, n){
  const M = window.PANELS.meta || {}, light = !!M.chrome;     // meta.chrome = colour for dark posts
  const col = M.chrome || PAPER.soft, handle = M.handle === undefined ? '@stemhead' : M.handle;
  withKind('chrome', ()=>{
    const y = SAFE.y1 - 30;
    if(handle) ink(handle, SAFE.x0+6, y, {size:34, weight:800, align:'left', color:col});
    const last = i===n-1, right = SAFE.x1Low - 10, cx = right - (last?0:64);
    ink(`${i+1}/${n}`, cx, y, {size:34, weight:800, align:'right', color:col});
    if(!last) markerArrow(right-50, y+2, right-2, y-2, {bend:0.0, head:16, width:6, color:light?col:PAPER.ink, alpha:light?0.85:0.6, wobble:0.8, streaks:false, seed:900+i, blend:light?'source-over':'multiply'});
  });
}

window.renderPanel = function(i){
  const P = window.PANELS, n = P.draw.length;
  TEXT_LOG = []; window.TEXT_KIND = 'body'; markerSeed(i+1);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowColor = 'transparent';
  paperBg(i+1, (P.meta && P.meta.paper) || {});
  P.draw[i]({i, n, sim: window.SIM || null});
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  cornerTags(i, n);
  return {n, text: TEXT_LOG};
};
window.panelCount = () => window.PANELS.draw.length;
window.panelMeta = () => window.PANELS.meta || {};
</script></body></html>
